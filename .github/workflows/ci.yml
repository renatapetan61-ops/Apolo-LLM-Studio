name: Apolo LLM Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/control-plane/package.json
      - name: Install dependencies
        working-directory: services/control-plane
        run: npm install
      - name: Typecheck and build
        working-directory: services/control-plane
        run: npm run build

  android:
    runs-on: ubuntu-latest
    env:
      APOLO_KEYSTORE_BASE64: ${{ secrets.APOLO_KEYSTORE_BASE64 }}
      APOLO_STORE_PASSWORD: ${{ secrets.APOLO_STORE_PASSWORD }}
      APOLO_KEY_ALIAS: ${{ secrets.APOLO_KEY_ALIAS }}
      APOLO_KEY_PASSWORD: ${{ secrets.APOLO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug
      - name: Prepare Android signing files
        if: ${{ env.APOLO_KEYSTORE_BASE64 != '' && env.APOLO_STORE_PASSWORD != '' && env.APOLO_KEY_ALIAS != '' && env.APOLO_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$APOLO_KEYSTORE_BASE64" | base64 --decode > android/apolo-upload.jks
          test -s android/apolo-upload.jks
          # Validate the supplied store password and alias before Gradle runs.
          keytool -list -keystore android/apolo-upload.jks \
            -storepass "$APOLO_STORE_PASSWORD" -alias "$APOLO_KEY_ALIAS" >/dev/null
          # Normalize JKS/PKCS12 input into a PKCS12 keystore with one consistent password.
          keytool -importkeystore -noprompt \
            -srckeystore android/apolo-upload.jks \
            -srcstorepass "$APOLO_STORE_PASSWORD" \
            -srcalias "$APOLO_KEY_ALIAS" \
            -srckeypass "$APOLO_STORE_PASSWORD" \
            -destkeystore android/apolo-release.p12 \
            -deststoretype PKCS12 \
            -deststorepass "$APOLO_STORE_PASSWORD" \
            -destkeypass "$APOLO_STORE_PASSWORD" \
            -destalias "$APOLO_KEY_ALIAS"
          printf 'storeFile=../apolo-release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$APOLO_STORE_PASSWORD" "$APOLO_KEY_ALIAS" "$APOLO_STORE_PASSWORD" \
            > android/keystore.properties
      - name: Build signed release APK
        if: ${{ env.APOLO_KEYSTORE_BASE64 != '' && env.APOLO_STORE_PASSWORD != '' && env.APOLO_KEY_ALIAS != '' && env.APOLO_KEY_PASSWORD != '' }}
        run: gradle -p android :app:assembleRelease
      - name: Upload signed release APK
        if: ${{ success() && env.APOLO_KEYSTORE_BASE64 != '' && env.APOLO_STORE_PASSWORD != '' && env.APOLO_KEY_ALIAS != '' && env.APOLO_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: apolo-llm-studio-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f android/apolo-upload.jks android/apolo-release.p12 android/keystore.properties
