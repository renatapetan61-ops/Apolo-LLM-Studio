name: Apolo LLM Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/control-plane/package.json
      - name: Install dependencies
        working-directory: services/control-plane
        run: npm install
      - name: Typecheck and build
        working-directory: services/control-plane
        run: npm run build

  android:
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.release-eligibility.outputs.ready }}
    env:
      APOLO_KEYSTORE_BASE64: ${{ secrets.APOLO_KEYSTORE_BASE64 }}
      APOLO_STORE_PASSWORD: ${{ secrets.APOLO_STORE_PASSWORD }}
      APOLO_KEY_ALIAS: ${{ secrets.APOLO_KEY_ALIAS }}
      APOLO_KEY_PASSWORD: ${{ secrets.APOLO_KEY_PASSWORD }}
      APOLO_CLERK_PUBLISHABLE_KEY: ${{ secrets.APOLO_CLERK_PUBLISHABLE_KEY }}
      APOLO_API_BASE_URL: https://apolo-llm-studio-api-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - name: Validate Clerk Publishable Key
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$APOLO_CLERK_PUBLISHABLE_KEY" in
            pk_test_*|pk_live_*) echo "Clerk Publishable Key configurada." ;;
            *) echo "::error::APOLO_CLERK_PUBLISHABLE_KEY ausente ou inválida. Cadastre uma chave pk_test_ ou pk_live_ nos Actions Secrets."; exit 1 ;;
          esac
      - name: Check signed release eligibility
        id: release-eligibility
        if: ${{ env.APOLO_KEYSTORE_BASE64 != '' && env.APOLO_STORE_PASSWORD != '' && env.APOLO_KEY_ALIAS != '' && env.APOLO_KEY_PASSWORD != '' }}
        run: echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug
      - name: Prepare Android signing files
        if: ${{ env.APOLO_KEYSTORE_BASE64 != '' && env.APOLO_STORE_PASSWORD != '' && env.APOLO_KEY_ALIAS != '' && env.APOLO_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Decode Android upload keystore"
          if ! printf '%s' "$APOLO_KEYSTORE_BASE64" | base64 --decode > android/apolo-upload.jks; then
            echo "::error::APOLO_KEYSTORE_BASE64 não contém Base64 válido."
            exit 1
          fi
          if [ ! -s android/apolo-upload.jks ]; then
            echo "::error::O keystore decodificado está vazio."
            exit 1
          fi
          echo "Arquivo de assinatura decodificado."
          echo "::endgroup::"

          echo "::group::Inspect and validate upload keystore"
          echo "Tamanho do arquivo decodificado: $(wc -c < android/apolo-upload.jks) bytes."
          # Não forçar o tipo: keytool detecta JKS ou PKCS12 pelo conteúdo.
          if ! keytool -list -keystore android/apolo-upload.jks \
            -storepass "$APOLO_STORE_PASSWORD" -alias "$APOLO_KEY_ALIAS"; then
            echo "::error::O arquivo decodificado não é um keystore JKS/PKCS12 válido, está truncado, ou senha/alias não correspondem. EOFException normalmente indica arquivo inválido ou incompleto. Gere novamente o Base64 a partir do arquivo .jks/.p12 binário original e atualize APOLO_KEYSTORE_BASE64."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Normalize release keystore"
          if ! keytool -importkeystore -noprompt \
            -srckeystore android/apolo-upload.jks \
            -srcstorepass "$APOLO_STORE_PASSWORD" \
            -srcalias "$APOLO_KEY_ALIAS" \
            -srckeypass "$APOLO_KEY_PASSWORD" \
            -destkeystore android/apolo-release.p12 \
            -deststoretype PKCS12 \
            -deststorepass "$APOLO_STORE_PASSWORD" \
            -destkeypass "$APOLO_STORE_PASSWORD" \
            -destalias "$APOLO_KEY_ALIAS"; then
            echo "::error::O keystore de origem foi reconhecido, mas a chave privada não pôde ser importada. Confira APOLO_KEY_PASSWORD, APOLO_STORE_PASSWORD e APOLO_KEY_ALIAS."
            exit 1
          fi
          if ! keytool -list -storetype PKCS12 -keystore android/apolo-release.p12 \
            -storepass "$APOLO_STORE_PASSWORD" -alias "$APOLO_KEY_ALIAS" >/dev/null; then
            echo "::error::O keystore PKCS12 de destino não passou na validação."
            exit 1
          fi
          echo "Keystore de Release validado."
          echo "::endgroup::"

          printf 'storeFile=../apolo-release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$APOLO_STORE_PASSWORD" "$APOLO_KEY_ALIAS" "$APOLO_STORE_PASSWORD" \
            > android/keystore.properties
      - name: Build signed release APK
        if: ${{ env.APOLO_KEYSTORE_BASE64 != '' && env.APOLO_STORE_PASSWORD != '' && env.APOLO_KEY_ALIAS != '' && env.APOLO_KEY_PASSWORD != '' }}
        run: gradle -p android :app:assembleRelease
      - name: Upload signed release APK
        if: ${{ success() && env.APOLO_KEYSTORE_BASE64 != '' && env.APOLO_STORE_PASSWORD != '' && env.APOLO_KEY_ALIAS != '' && env.APOLO_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: apolo-llm-studio-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f android/apolo-upload.jks android/apolo-release.p12 android/keystore.properties

  publish-release:
    name: Publish APK to GitHub Releases
    runs-on: ubuntu-latest
    needs: android
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.android.outputs.release_ready == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: apolo-llm-studio-release-apk
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apolo-llm-studio-build-${{ github.run_number }}
          name: Apolo LLM Studio — build ${{ github.run_number }}
          body: |
            APK Release assinado do Apolo LLM Studio.

            - Versão Android: 0.1.3
            - Build do GitHub Actions: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
          files: release-assets/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
