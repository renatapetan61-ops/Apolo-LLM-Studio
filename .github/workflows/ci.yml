name: Apolo LLM Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/control-plane/package.json
      - name: Install dependencies
        working-directory: services/control-plane
        run: npm install
      - name: Typecheck and build
        working-directory: services/control-plane
        run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug
